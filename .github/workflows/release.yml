name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jellyfin-plugin-request-movies
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet test RequestMovies.slnx -c Release
      - name: Build packages and update manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          dotnet build Jellyfin.Plugin.RequestMovies/Jellyfin.Plugin.RequestMovies.csproj -c Release -f net9.0 -p:Version="$VERSION" -p:AssemblyVersion="$VERSION.0" -p:FileVersion="$VERSION.0"
          dotnet build Jellyfin.Plugin.RequestMovies/Jellyfin.Plugin.RequestMovies.csproj -c Release -f net10.0 -p:Version="$VERSION" -p:AssemblyVersion="$VERSION.0" -p:FileVersion="$VERSION.0"
          zip -j "dist/request-movies_10.11_${VERSION}.zip" Jellyfin.Plugin.RequestMovies/bin/Release/net9.0/Jellyfin.Plugin.RequestMovies.dll
          zip -j "dist/request-movies_12.4_${VERSION}.zip" Jellyfin.Plugin.RequestMovies/bin/Release/net10.0/Jellyfin.Plugin.RequestMovies.dll
          python3 scripts/update-manifest.py "$VERSION" "dist/request-movies_10.11_${VERSION}.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/request-movies_10.11_${VERSION}.zip" "10.11.0"
          python3 scripts/update-manifest.py "$VERSION" "dist/request-movies_12.4_${VERSION}.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/request-movies_12.4_${VERSION}.zip" "12.4.0"
          cp manifest.json dist/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            jellyfin-plugin-request-movies/dist/*.zip
            jellyfin-plugin-request-movies/dist/manifest.json
      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "Manifest ${GITHUB_REF_NAME}" || true
          git push origin HEAD:main
