name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example 1.1.0)
        required: true
        default: 1.2.2
        type: string
permissions:
  contents: write
concurrency:
  group: request-movies-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: jellyfin-plugin-request-movies
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet test RequestMovies.slnx -c Release
      - name: Build packages and update manifest
        run: |
          VERSION="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use the format major.minor.patch (for example 1.1.0)." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          mkdir -p dist
          dotnet build Jellyfin.Plugin.RequestMovies/Jellyfin.Plugin.RequestMovies.csproj -c Release -f net9.0 -p:Version="$VERSION" -p:AssemblyVersion="$VERSION.0" -p:FileVersion="$VERSION.0"
          dotnet build Jellyfin.Plugin.RequestMovies/Jellyfin.Plugin.RequestMovies.csproj -c Release -f net10.0 -p:Version="$VERSION" -p:AssemblyVersion="$VERSION.0" -p:FileVersion="$VERSION.0"
          zip -j "dist/request-movies_10.11_${VERSION}.zip" Jellyfin.Plugin.RequestMovies/bin/Release/net9.0/Jellyfin.Plugin.RequestMovies.dll
          zip -j "dist/request-movies_12.4_${VERSION}.zip" Jellyfin.Plugin.RequestMovies/bin/Release/net10.0/Jellyfin.Plugin.RequestMovies.dll
          python3 scripts/update-manifest.py "$VERSION" "dist/request-movies_10.11_${VERSION}.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/request-movies_10.11_${VERSION}.zip" "10.11.0"
          python3 scripts/update-manifest.py "$VERSION" "dist/request-movies_12.4_${VERSION}.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/request-movies_12.4_${VERSION}.zip" "12.4.0"
          cp manifest.json dist/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: main
          name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            jellyfin-plugin-request-movies/dist/*.zip
            jellyfin-plugin-request-movies/dist/manifest.json
      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Manifest v${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "The manifest commit is already present on main."
              exit 0
            fi

            if ! git rebase origin/main; then
              echo "Could not rebase the manifest update onto the latest main branch." >&2
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Updated plugin manifest on main."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 5))
              echo "Push failed; retrying in ${delay}s (attempt $((attempt + 1)) of 5)." >&2
              sleep "$delay"
            fi
          done

          echo "Failed to push the updated manifest after 5 attempts." >&2
          exit 1
