name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dotnet-version: 9.0.x
            target-framework: net9.0
          - dotnet-version: 10.0.x
            target-framework: net10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - run: dotnet build jellyfin-plugin-request-movies/RequestMovies.slnx -c Release -f ${{ matrix.target-framework }}
      - run: dotnet test jellyfin-plugin-request-movies/RequestMovies.slnx -c Release -f ${{ matrix.target-framework }} --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target-framework }}
          path: jellyfin-plugin-request-movies/Jellyfin.Plugin.RequestMovies/bin/Release/${{ matrix.target-framework }}/Jellyfin.Plugin.RequestMovies.dll
